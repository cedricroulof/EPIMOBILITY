[project]
name = "epimobility-backend"
version = "0.1.0"
description = "API et moteur d'affectation de la plateforme de mobilité internationale (projet pédagogique : partenariats fictifs)"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "psycopg[binary]",
    "sqlalchemy>=2",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx2", "pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # le formateur gère la longueur du code ; restent quelques commentaires et chaînes longs

[tool.ruff.lint.per-file-ignores]
"bench/run.py" = ["B023"]  # lambdas mesurées et appelées dans la même itération
