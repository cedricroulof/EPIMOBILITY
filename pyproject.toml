# Partie Python du mono-dépôt : un seul environnement et un seul verrou (uv.lock) pour apps/api et packages/*.
[project]
name = "epi-mobility"
version = "0.1.0"
description = "API et moteur d'affectation de la plateforme de mobilité internationale (projet pédagogique : partenariats fictifs)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "psycopg[binary]",
    "sqlalchemy>=2",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx2", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/engine", "packages/generator", "apps/api/app"]  # importés comme engine, generator, app
exclude = ["**/tests", "packages/engine/benchmark"]
dev-mode-dirs = ["packages", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-ra --import-mode=importlib"

# Job « Dependency licences » de la CI : une dépendance livrée dont la licence n'est pas ici fait échouer la PR.
# LGPL-3.0-only : psycopg, utilisé comme bibliothèque sans modification, compatible avec un projet MIT.
[tool.pip-licenses]
from = "mixed"
allow-only = "MIT;MIT License;MIT-0;BSD-2-Clause;BSD-3-Clause;Apache-2.0;PSF-2.0;LGPL-3.0-only"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # le formateur gère la longueur du code ; restent quelques commentaires et chaînes longs

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "generator"]

[tool.ruff.lint.per-file-ignores]
"packages/engine/benchmark/run.py" = ["B023"]  # lambdas mesurées et appelées dans la même itération
