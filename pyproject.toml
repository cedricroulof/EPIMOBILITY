# Python part of the monorepo: a single environment and a single lockfile (uv.lock) for apps/api and packages/*.
[project]
name = "epi-mobility"
version = "0.1.0"
description = "API and matching engine of the international mobility platform (educational project: fictional partnerships)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "psycopg[binary]",
    "sqlalchemy>=2",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx2", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/engine", "packages/generator", "apps/api/app"]  # imported as engine, generator, app
exclude = ["**/tests", "packages/engine/benchmark"]
dev-mode-dirs = ["packages", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-ra --import-mode=importlib"

# "Dependency licences" CI job: a shipped dependency whose licence is not listed here fails the PR.
# LGPL-3.0-only: psycopg, used as an unmodified library, compatible with an MIT project.
[tool.pip-licenses]
from = "mixed"
allow-only = "MIT;MIT License;MIT-0;BSD-2-Clause;BSD-3-Clause;Apache-2.0;PSF-2.0;LGPL-3.0-only"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E and W: pycodestyle (PEP 8); N: PEP 8 naming; line-length: team limit, wider than PEP 8's 79.
select = ["E", "W", "F", "I", "N", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "generator"]

[tool.ruff.lint.per-file-ignores]
"packages/engine/benchmark/run.py" = ["B023"]  # lambdas measured and called in the same iteration
