name: CI

# Every PR: conventions, lint, tests, build. All of these checks are required on main (CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      # Same hook and same version as locally (.pre-commit-config.yaml): a single source of truth.
      - name: Check every commit of the PR, then the PR title (it becomes the squash commit on main)
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          check() { uvx pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename "$1"; }
          status=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            check "$RUNNER_TEMP/msg.txt" || status=1
            echo "::endgroup::"
          done
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/msg.txt"
          echo "PR title: $TITLE"
          check "$RUNNER_TEMP/msg.txt" || status=1
          exit $status

  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit + functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest packages apps/api/tests/functional

  e2e:
    name: Build + end-to-end (Docker, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      # Builds the production image and starts the platform the way a newcomer would: one command.
      - run: docker compose up --build --detach --wait
      - run: uv run pytest apps/api/tests/e2e -s
        env:
          E2E_BASE_URL: http://localhost:8000
      - if: failure()
        run: docker compose logs api

  bench:
    name: Engine benchmark (68 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen python packages/engine/benchmark/run.py --out benchmark-results.md
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.md
