# Installation (une fois par clone) : pre-commit install
# Les mêmes hooks tournent en CI (.github/workflows/ci.yml) : un hook contourné localement est rattrapé en PR.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit] # seul le hook de message tourne à l'étape commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key # aucun secret dans le dépôt (exigence du sujet)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
